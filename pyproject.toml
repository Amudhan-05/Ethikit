[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethikit"
version = "0.1.0"
description = "Open-source orchestrator for evaluating the ethicality of ML models"
requires-python = ">=3.10"
# numpy<2 pinned to match requirements.txt: giskard's mlflow-skinny dependency
# requires it, and shap 0.52 (which asks for numpy>=2 in its own metadata) has
# been verified to run correctly on 1.26.x anyway.
dependencies = ["numpy>=1.24,<2", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
full = ["fairlearn>=0.10", "shap>=0.44", "aif360>=0.6.1", "giskard>=2.0,<3", "streamlit>=1.30", "plotly>=5.18",
       "matplotlib>=3.7"]
phase2 = ["pmlb>=1.0", "scipy>=1.11", "scikit-posthocs>=0.9"]
phase3 = ["adversarial-robustness-toolbox>=1.17", "alibi-detect>=0.12"]
domains = ["folktables>=0.0.12"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
ethikit = "ethikit.cli:main"

[tool.setuptools.packages.find]
include = ["ethikit*"]

[tool.setuptools.package-data]
ethikit = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests (need playwright + chromium); run with `pytest -m e2e`",
    "slow: takes more than a few seconds",
]
