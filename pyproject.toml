[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethikit"
version = "0.1.0"
description = "Open-source orchestrator for evaluating the ethicality of ML models"
requires-python = ">=3.10"
# numpy<2 pinned to match requirements.txt: giskard's mlflow-skinny dependency
# requires it, and shap 0.52 (which asks for numpy>=2 in its own metadata) has
# been verified to run correctly on 1.26.x anyway.
dependencies = ["numpy>=1.24,<2", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
full = ["fairlearn>=0.10", "shap>=0.44", "giskard>=2.0", "streamlit>=1.30", "plotly>=5.18",
       "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["ethikit*"]
