# Checker only: nothing is deployed. ethikit runs locally.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-core.txt fairlearn aif360 shap adversarial-robustness-toolbox folktables scipy pytest jsonschema pyyaml playwright axe-playwright-python
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install captum opacus
      - run: pip install -e . --no-deps
      - run: python -m pytest -m "not e2e"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -m e2e
